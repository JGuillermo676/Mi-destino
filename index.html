<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Danna ✨</title>

<!-- 📊 GOOGLE ANALYTICS -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4ZMY03QL2Q"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('js', new Date());
  gtag('config', 'G-4ZMY03QL2Q');

  // 🧪 evento de prueba al cargar
  gtag('event', 'page_view_danna_stars');

  console.log("🔥 GA cargado: Danna Stars");
</script>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #111 0%, #000 70%);
  color: white;
  min-height: 100vh;
  overflow-y: auto;
  position: relative;

  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* Botón inicial */
#openBtn {
  padding: 18px 36px;
  font-size: 1.3rem;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg, #8a5cff, #cfa7ff);
  border: none;
  border-radius: 25px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
  transition: transform 0.3s, box-shadow 0.3s;
  z-index: 10;
}

#openBtn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px #cfa7ff;
}

/* Tarjeta */
.card {
  display: none;
  background: rgba(20, 20, 30, 0.85);
  border-radius: 20px;
  box-shadow: 0 0 25px rgba(255,255,255,0.15);
  padding: 15px 20px;
  width: 85%;
  max-width: 400px;
  text-align: center;
  margin: 20px auto;
  backdrop-filter: blur(6px);
  transform: scale(0.77);
}

h1 {
  color: #cfa7ff;
  font-size: 1.7rem;
  margin-bottom: 6px;
}

.poem {
  margin: 12px 0;
  font-size: 0.9rem;
  font-style: italic;
  line-height: 1.5;
  color: #ddd;
  white-space: pre-line;
}

button.messageBtn {
  margin-top: 12px;
  padding: 9px 18px;
  font-size: 0.9rem;
  background: linear-gradient(135deg, #8a5cff, #cfa7ff);
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
}

button.messageBtn:hover {
  transform: scale(1.05);
}

#personalPhoto {
  margin-top: 12px;
  max-width: 100%;
  border-radius: 12px;
  display: none;
}

#specialMessage {
  margin-top: 8px;
  font-size: 0.9rem;
  color: #cfa7ff;
  display: none;
}

/* estrellas */
.meteor {
  position: absolute;
  font-size: 14px;
  opacity: 0.8;
  animation: shoot linear infinite;
}

@keyframes shoot {
  0% { transform: translate(0,0); opacity:1; }
  100% { transform: translate(80vw, 100vh); opacity:0; }
}
</style>
</head>

<body>

<button id="openBtn">Ábreme</button>

<audio id="backgroundMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="card" id="messageCard">
  <h1>Para Danna ✨</h1>

  <div class="poem">
    <!-- TU TEXTO COMPLETO IGUAL -->
    (se mantiene igual que lo enviaste)
  </div>

  <button class="messageBtn" id="showPhotoBtn">Haz clic aquí</button>

  <img id="personalPhoto" src="estrella.png" alt="Foto personal">
  <div id="specialMessage">✨SIEMPRE SERÁS MI ESTRELLA FAVORITA ✨</div>
</div>

<script>

const openBtn = document.getElementById("openBtn");
const music = document.getElementById("backgroundMusic");
const messageCard = document.getElementById("messageCard");

openBtn.addEventListener("click", () => {
  music.play();
  messageCard.style.display = "block";
  openBtn.style.display = "none";

  // 📊 evento analytics
  gtag('event', 'open_poem_danna');

  const stars = ['🌟','✧'];
  const totalMeteors = Math.floor(12 * 0.3);

  for (let i = 0; i < totalMeteors; i++) {
    const meteor = document.createElement('span');
    meteor.classList.add('meteor');
    meteor.textContent = stars[Math.floor(Math.random() * stars.length)];
    meteor.style.left = Math.random() * 30 + 'vw';
    meteor.style.top = Math.random() * 10 + 'px';
    meteor.style.fontSize = (8 + Math.random() * 16) + 'px';
    meteor.style.animationDuration = (0.6 + Math.random() * 0.9) + 's';
    meteor.style.animationDelay = Math.random() * 2 + 's';

    document.body.appendChild(meteor);
  }
});

const showPhotoBtn = document.getElementById("showPhotoBtn");
const photo = document.getElementById("personalPhoto");
const specialMsg = document.getElementById("specialMessage");

showPhotoBtn.addEventListener("click", () => {
  photo.style.display = "block";
  specialMsg.style.display = "block";
  showPhotoBtn.style.display = "none";

  // 📊 evento analytics
  gtag('event', 'photo_revealed_danna');
});

</script>

</body>
</html>
